<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RSI Strength Divergence – Visual Companion</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background:#f5f5f5; }
  h1 { color:#333; }
  .chart { width:600px; height:300px; background:#fff; margin-bottom:20px; border:1px solid #ddd; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { border:1px solid #ccc; padding:5px; text-align:center; }
  th { background:#444; color:#fff; }
  .green { background:#c8e6c9; }
  .red { background:#ffccbc; }
  .yellow { background:#fff9c4; }
</style>
</head>
<body>
<h1>RSI Strength Divergence – Gold vs DXY</h1>
<div class="chart" id="chartGold">[Gold EMA RSI Chart placeholder]</div>
<div class="chart" id="chartDxy">[DXY EMA RSI Chart placeholder]</div>
<h2>Strength Table</h2>
<table id="strengthTable">
  <tr><th>Symbol</th><th>Strength</th></tr>
  <tr class="green"><td>Gold</td><td>68.4</td></tr>
  <tr class="red"><td>DXY</td><td>71.2</td></tr>
  <tr><td>Lead</td><td>Gold leads</td></tr>
  <tr class="green"><td>Confluence</td><td>66</td></tr>
  <tr><td>Gap</td><td>0.6</td></tr>
  <tr class="green"><td>%Δ</td><td>+0.8%</td></tr>
</table>
</body>
</html>
